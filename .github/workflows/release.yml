name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Запускается при создании тега, начинающегося с 'v'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.4)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build universal binary
      run: |
        chmod +x ./scripts/build-universal.sh
        ./scripts/build-universal.sh

    - name: Verify app exists
      run: |
        if [ ! -d "build/export/MegaplanHepler.app" ]; then
          echo "❌ Ошибка: приложение не найдено в build/export/"
          ls -la build/export/
          exit 1
        fi
        echo "✅ Приложение найдено: build/export/MegaplanHepler.app"
        du -sh build/export/MegaplanHepler.app

    - name: Notarize application
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
          echo "ℹ️ Notarization skipped: required Apple secrets are not configured."
          exit 0
        fi

        chmod +x ./scripts/notarize-app.sh
        ./scripts/notarize-app.sh "${{ github.workspace }}/build/export/MegaplanHepler.app"

    - name: Create release archive
      env:
        RELEASE_TAG_INPUT: ${{ inputs.tag }}
      run: |
        if [ -n "$RELEASE_TAG_INPUT" ]; then
          VERSION="${RELEASE_TAG_INPUT#v}"
        else
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi

        cd build/export
        zip -r "MegaplanHelper-v${VERSION}.zip" MegaplanHepler.app
        cd ../..
        echo "✅ Архив создан: build/export/MegaplanHelper-v${VERSION}.zip"
        ls -lh build/export/*.zip

    - name: Upload release asset
      uses: softprops/action-gh-release@v1
      with:
        files: build/export/MegaplanHelper-v*.zip
        draft: false
        prerelease: false
        tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
